version: '3.8'

services:
  db:
    image: postgres:16
    container_name: taskmanager_db
    environment:
      POSTGRES_USER: ${DB_USER:-db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан — скопируйте .env.example в .env}
      POSTGRES_DB: ${DB_NAME:-task_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
